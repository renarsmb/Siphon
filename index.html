<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Dayline — Timeline Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <div class="header-top"><div class="brand">dayline<span class="brand-dot">.</span></div><button id="accountBtn" class="text-button" type="button">Account</button></div>
      <div class="date-top"><div><p id="weekLabel" class="eyebrow"></p><h1 id="dateTitle">Today</h1></div><button id="todayBtn" class="today-button" type="button">Today</button></div>
      <nav id="weekStrip" class="week-strip" aria-label="Choose day"></nav>
      <div class="toolbar"><div id="daySummary" class="day-summary" aria-live="polite"></div><button id="addTop" class="add-small" type="button"><span aria-hidden="true">＋</span> Add</button></div>
    </header>

    <main id="schedule" class="schedule" aria-label="Daily timeline">
      <div id="timeline" class="timeline"></div>
      <div id="emptyState" class="empty-state" hidden>No plans for this day. Tap + to add one.</div>
    </main>
    <button id="addFab" class="fab" type="button" aria-label="Add plan">＋</button>
    <nav class="bottom-nav" aria-label="Galvenā navigācija"><button class="nav-item active" type="button" id="timelineTab"><span class="material-symbols-outlined">view_timeline</span><span>Laika josla</span></button><button class="nav-item" type="button" id="upcomingTab"><span class="material-symbols-outlined">calendar_month</span><span>Tuvākie</span></button><button class="nav-item" type="button" id="bulletinsTab"><span class="material-symbols-outlined">inbox</span><span>Biļetenes</span></button></nav>
  </div>

  <dialog id="taskDialog" class="sheet"><form id="taskForm" method="dialog" novalidate><div class="sheet-head"><h2 id="sheetTitle">New plan</h2><button class="icon-button" type="button" id="closeSheet" aria-label="Close">×</button></div><label for="taskTitle">Title</label><input id="taskTitle" name="title" type="text" maxlength="120" autocomplete="off" required placeholder="What are you planning?"><label for="taskNotes">Notes <span class="muted">(optional)</span></label><textarea id="taskNotes" rows="2" maxlength="2000" placeholder="Details"></textarea><div class="two-col"><div><label for="taskDate">Date</label><input id="taskDate" type="date" required></div><div><label for="taskCategory">Category</label><select id="taskCategory"><option value="personal">Personal</option><option value="school">School</option><option value="work">Work</option><option value="health">Health</option></select></div></div><div class="two-col"><div><label for="taskStart">Start</label><input id="taskStart" type="time" required></div><div><label for="taskEnd">End</label><input id="taskEnd" type="time" required></div></div><label class="checkbox-label"><input id="taskDone" type="checkbox"> Completed</label><p id="formError" class="error" role="alert"></p><div class="form-actions"><button id="deleteTask" class="delete-button" type="button" hidden>Delete</button><button id="saveTask" class="primary-button" type="submit">Save plan</button></div></form></dialog>

  <dialog id="accountDialog" class="sheet"><div class="sheet-head"><h2>Account & sync</h2><button id="closeAccount" class="icon-button" type="button" aria-label="Close">×</button></div><div id="accountContent"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));</script>
</body>
</html>
